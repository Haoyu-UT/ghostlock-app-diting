# GhostLock kernel profile: Redmi K50 Ultra (diting, SM8475), 5.10.136 GKI
# (Global V14.0.3.0.TLFMIXM / V14.0.4.0.TLFMIXM).
#
# CANDIDATE -- DERIVED, NOT DEVICE-VERIFIED (2026-10-14). Do not mark this
# build supported, and do not bundle this file into the app, until a device
# gate passes. Every value below was read out of this kernel image (or out of
# the device-verified 5.10.236 control image, as a control) with the tools in
# ghostlock-app; nothing here has executed on a phone. Method, per-value
# basis and raw evidence: external/port/k136/README.md and the files beside
# it. Derived by porting the device-verified 5.10.236 profile to this build,
# the way external/port/k226 and external/port/k101 were derived.
#
# Route: select_stack. This kernel's do_futex frame is 0x70 (5.10.136 is the
# version it becomes 0x70), so the select_stack waiter sits in band; the route
# refuses at prepare() on the 5.10.81/5.10.101 geometry (do_futex 0x20).

# Bundled 2026-10-14 by operator decision: this profile is a CONFIG EXPORTED
# FROM THE KERNEL and verified against the kernel running under QEMU -- it has
# never actually run on a device. Treat it as untested; report failures.
release = "5.10.136-android12-9-00021-g821df8f5bd36-ab9585204"
schema_version = 1
kernel_major = 5
recommend_shizuku = 0
# Device-level values, not build-level: the extractor emits the same pair for
# this image as for 5.10.236 (offsets-5.10.136.txt; --iomem external/iomap.txt
# --phys 0xa8000000).
kernel_phys_load = 2818572288
kernel_phys_offset = 2147483648
route {
  select_stack {
    # Unchanged. Every term of the profile's own arithmetic is re-read from
    # this image's prologues and equals 5.10.236's: __arm64_sys_pselect6
    # (sub sp,#0xa0) + core_sys_select (#0x1c0), __arm64_sys_futex (#0x90) +
    # do_futex (#0x70) + futex_wait_requeue_pi (#0x1a0). core_sys_select's
    # fd_set_bits buffers are also zeroed at the same frame slots in both
    # images (stp xzr,xzr,[sp,#0x140] down to [sp,#0x20] at the same
    # instruction slots). disasm-frames-5.10.136.txt.
    waiter_shift = -2
    compact_waiter = 1
    # CHANGED vs 5.10.236 (44279184): dump_skip.zeroes is at image +0x2a1d5a0
    # = 44160416 here. Same acceptance profile as 236: the next symbol is
    # core_uses_pid at +0x1000 (the 0x1000-byte array is the whole extent),
    # bss_xref finds 2 adrp references, both inside dump_skip, init-range
    # 0/2, and the page (and the page before it) is all-zero in the image
    # file. anchor-xref-5.10.136.txt; symbols_near in the same file.
    lock_anchor_image = 44160416
    # The region's bound and slot pitch: 0x1000 = 4096 is the array itself
    # (core_uses_pid begins at +0x1000); 0x20 = 32 is sizeof(struct rt_mutex)
    # for this build's lock config. The pitch's load-bearing fact is re-read
    # here: rt_mutex_adjust_prio_chain reaches the owner through +0x18 in
    # this image exactly as in 236 (`add x8, x27, #0x18; ldar x8, [x8];
    # and x8, x8, #0xfffffffffffffffe`). Neither DEBUG_RT_MUTEXES, LOCKDEP,
    # DEBUG_SPINLOCK nor DEBUG_LOCK_ALLOC is set in either config.
    lock_anchor_bytes = 4096
    lock_anchor_stride = 32
  }
}
fallback {
  to = "none"
}
execution {
  # Behaviour knobs, not layout: unchanged from the device-verified 236
  # profile (its batch-D/E series picked 4/5, 30ms and 10ms; the same ROM
  # userspace drives them here). Nothing below was re-derived from this
  # image, and nothing below needs to be.
  selected_cpus {
    main = 4
    consumer = 5
  }
  race {
    route_wait_ms = 30
    setup_settle_us = 10000
  }
  routes {
    select_stack {
      enter_delay_us = 5000
    }
  }
}
kernelsnitch {
  collisions = 8
  # 960, re-derived here rather than copied. 5.10.136 creates the mm_struct
  # cache in proc_caches_init (236: mm_cache_init); the kmem_cache_create_usercopy
  # call is the same one: x0 = page 0x2083000 + 0xbee, which the image's own
  # bytes show is the literal "mm_struct", w1 = #0x3c0 (960), w3 = #0x4042000,
  # w4 = #0x168 (useroffset), w5 = #0x170. Same five immediates in 236's
  # mm_cache_init. disasm-mm-cache-init-5.10.136.txt.
  mm_struct_sz = 960
}
# All fifteen task_struct fields below are read out of this image's own
# instructions, in the same functions the 236 control uses, and land on the
# shipped 236 values at the same instruction slots:
#   prio 0x84 / normal_prio 0x8c          __sched_setscheduler
#   pi_lock 0x86c                          __sched_setscheduler, rt_mutex_adjust_prio_chain
#   pi_waiters 0x880 / pi_blocked_on 0x898 rt_mutex_adjust_prio_chain
#   pi_top_task 0x890                      rt_mutex_setprio
#   pid 0x5c8 / tgid 0x5cc / tasks 0x4c8   copy_process
#   real_cred 0x778 / cred 0x780           commit_creds (cred also in prepare_creds)
#   comm 0x790                             __set_task_comm
#   seccomp 0x848                          __secure_computing
#   sched_task_group 0x310                 sched_move_task, task_change_group_fair
#   atomic_flags 0x590                     proc_pid_status, seccomp_set_mode_filter
# (sched_task_group and atomic_flags could NOT be read out on 5.10.101; on this
# image they can, and they match.) disasm-fields-5.10.136.txt,
# disasm-fields-extra-5.10.136.txt.
task_struct {
  prio = 132
  normal_prio = 140
  sched_task_group = 784
  pi_lock = 2156
  pi_waiters = 2176
  pi_top_task = 2192
  pi_blocked_on = 2200
  pid = 1480
  tgid = 1484
  atomic_flags = 1424
  real_cred = 1912
  cred = 1920
  comm = 1936
  tasks = 1224
  seccomp = 2120
}
cred {
  # copy_size 168 is re-derived, twice, from this image: prepare_creds copies
  # with `mov w2, #0xa8` into the object it just allocated from cred_jar (the
  # whole prologue is instruction-identical to 236's), and put_cred_rcu does
  # `sub x19, x0, #0x98` (container_of on rcu_head) + 16 = 0xa8. The block
  # itself is proven identical by cap_capable, which is instruction-identical
  # to 236's 33 instructions: `ldr x8, [x0, #0x88]` (user_ns = ref1_offset)
  # and `ldr w8, [x8, #0x38]` (cap_effective) put caps_offset at 40 -- only
  # the 4-byte atomic_t usage fits, so vanilla's atomic_long_t change is NOT
  # in this image. commit_creds' `stadd w9, [x8]` (32-bit atomic on
  # usage@+0) says the same. caps_value 2199023255551 = 41 bits: cap_last_cap
  # is 40 in this image (u32 at +0x2135044 read out of the file), as in 236.
  copy_size = 168
  usage_offset = 0
  usage_value = 256
  caps_offset = 40
  caps_count = 5
  caps_value = 2199023255551
  ref_count = 3
  ref0_offset = 128
  # CHANGED vs 5.10.236: root_user is at image +0x278f4b0 here (was +0x27af5e0).
  # Value = the signed 64-bit contraction of KIMAGE_TEXT_BASE (0xffffffc080000000)
  # + offset, the same encoding the shipped values decode to (checked against
  # the 236 control image first: -272688810528 + 0xffffffc080000000 = 0x27af5e0
  # = its root_user exactly). symbols-5.10.136.txt.
  ref0_image = -272688941904
  ref1_offset = 136
  # CHANGED vs 5.10.236: init_user_ns at image +0x278f548 (was +0x27af678).
  ref1_image = -272688941752
  ref2_offset = 144
  # CHANGED vs 5.10.236: init_groups at image +0x27909d8 (was +0x27b0b08).
  ref2_image = -272688936488
  ref3_offset = 0
  ref3_image = 0
}
offset {
  # All ten differ from 5.10.236 -- this is a different build. Every one comes
  # from ghostlock-extract run on this image, and the extractor is validated as
  # a control by running it on external/rom/Image-5.10.236-control, where it
  # reproduces all ten shipped, device-verified values exactly
  # (offsets-5.10.236-control.txt). Cross-checked against sym_grep on this
  # image for the seven that are names: init_task, init_cred, empty_zero_page,
  # root_task_group, security_hook_heads, selinux_blob_sizes, and
  # selinux_enforcing (= the selinux_state symbol) / slide_boot_id
  # (= sysctl_bootid) / slide_loggers_0_1 (= loggers + 0x10), all agreeing with
  # the extractor. symbols-5.10.136.txt.
  init_task = 41402240
  init_cred = 41486640
  empty_zero_page = 43454464
  root_task_group = 43475008
  selinux_enforcing = 44194704
  selinux_blob_sizes = 36562288
  security_hook_heads = 36560608
  slide_nfulnl_logger = 41358416
  slide_loggers_0_1 = 41358216
  slide_boot_id = 44299077
}
