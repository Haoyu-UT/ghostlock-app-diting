# GhostLock kernel profile: Redmi K50 Ultra (diting, SM8475), 5.10.198 GKI —
# Global OS1.0.5.0.ULFMIXM / OS1.0.6.0.ULFMIXM (Android 14, built 2023-11-22).
#
# ############################################################################
# # CANDIDATE — DERIVED, NOT DEVICE-VERIFIED (2026-10-14).                   #
# #                                                                          #
# # Every value below is read out of this kernel image's own code or its own  #
# # config; no run has executed it. Do not mark this build supported until a  #
# # device gate passes (the 236 / 226 / 209 profiles each had one).           #
# #                                                                          #
# # Derivation, per field, with the instruction quoted for each:             #
# # external/port/k198/README.md. Route is select_stack: this kernel's        #
# # do_futex frame is 0x70 (it becomes 0x70 at 5.10.136), so the waiter sits  #
# # inside that route's band — unlike 5.10.81/101, which need sigreturn.      #
# ############################################################################

# Bundled 2026-10-14 by operator decision: this profile is a CONFIG EXPORTED
# FROM THE KERNEL and verified against the kernel running under QEMU -- it has
# never actually run on a device. Treat it as untested; report failures.
release = "5.10.198-android12-9-00085-g226a9632f13d-ab11136126"
schema_version = 1
kernel_major = 5
recommend_shizuku = 0
# Device-level, not build-level: emitted for this image by ghostlock-extract
# (with --iomem external/iomap.txt --phys 0xa8000000) and identical on every
# diting kernel. k198/offsets-5.10.198.txt.
kernel_phys_load = 2818572288
kernel_phys_offset = 2147483648
route {
  select_stack {
    # Unchanged: core_sys_select's frame is `sub sp, sp, #0x1c0` and
    # futex_wait_requeue_pi's is `sub sp, sp, #0x1a0` here, exactly as on 236 —
    # the two functions are instruction-identical apart from address
    # materialisation (962 insns each, 13 operands differ, all relocations).
    # The pselect fd_set buffer sits at sp+0x50 in both. See
    # disasm-diff-5.10.198-vs-5.10.236.txt.
    waiter_shift = -2
    compact_waiter = 1
    # dump_skip.zeroes = image +0x2a27598 (44201368). Same acceptance profile as
    # the device-verified 236 anchor: in .bss (__bss_start 0x2977000 <=
    # 0x2a27598 < __bss_stop 0x2a6ec1c), neighbour core_uses_pid exactly +0x1000
    # away, two references, both inside dump_skip (reads), init-range hits 0/2.
    # anchor-xref-5.10.198.txt, neighbours-5.10.198.txt.
    lock_anchor_image = 44201368
    # 4096 = the array itself (unsigned char zeroes[PAGE_SIZE]); 32 =
    # sizeof(struct rt_mutex) under this build's lock-debug config, which is
    # unchanged (config-diff: no CONFIG_DEBUG_RT_MUTEXES / LOCKDEP line differs;
    # rtmutex.h body identical in vanilla either side too).
    lock_anchor_bytes = 4096
    lock_anchor_stride = 32
  }
}
fallback {
  to = "none"
}
execution {
  # Behaviour knobs, not layout: carried from 5.10.236 (k226/README.md).
  selected_cpus {
    main = 4
    consumer = 5
  }
  race {
    route_wait_ms = 30
    setup_settle_us = 10000
  }
  routes {
    select_stack {
      enter_delay_us = 5000
    }
  }
}
kernelsnitch {
  collisions = 8
  # mm_cache_init holds the kmem_cache_create_usercopy("mm_struct", ...) call on
  # this build, as on 236 — `mov w1, #0x3c0` (960), flags `mov w3, #0x2000` +
  # `movk w3, #0x404, lsl #16` (0x4042000), `mov w4, #0x168` (useroffset),
  # `mov w5, #0x170` — identical to the 236 control but for the "mm_struct"
  # string address and the call target. So 960, not the extractor's 1024
  # template default.
  mm_struct_sz = 960
}
# All fifteen field offsets are read out of this image's own instructions and
# compared against the 5.10.236 control image (fields-5.10.198-vs-5.10.236.txt):
# every one lands at the same offset, and in seven of the eight functions used
# (rt_mutex_adjust_prio_chain, rt_mutex_setprio, commit_creds, __set_task_comm,
# cap_capable, sched_move_task, copy_seccomp) the instruction sequence is
# identical apart from immediate/address operands. The vanilla
# v5.10.198->v5.10.236 header diff is corroboration only, and this image
# contradicts it on struct cred (see the cred block below).
task_struct {
  prio = 132
  normal_prio = 140
  sched_task_group = 784
  pi_lock = 2156
  pi_waiters = 2176
  pi_top_task = 2192
  pi_blocked_on = 2200
  pid = 1480
  tgid = 1484
  atomic_flags = 1424
  real_cred = 1912
  cred = 1920
  comm = 1936
  tasks = 1224
  seccomp = 2120
}
cred {
  # cap_capable is byte-identical in the two images (33 insns, zero differing
  # operands) and reads cred->user_ns at +0x88, cred->euid at +0x14 and
  # cap_effective at +0x38. All three require the 4-byte atomic_t usage, so the
  # struct is byte-identical to 236's device-verified one -- the vanilla
  # v5.10.236 tag's atomic_long_t usage never reached the GKI tree.
  copy_size = 168
  usage_offset = 0
  usage_value = 256
  caps_offset = 40
  caps_count = 5
  caps_value = 2199023255551
  ref_count = 3
  ref0_offset = 128
  # ref*_image name root_user, init_user_ns, init_groups -- re-derived for this
  # build (symbols-5.10.198.txt) at +0x279f660 / +0x279f6f8 / +0x27a0b88.
  # Encoding verified by decoding the shipped 236 and 101 values first:
  # value = signed64(0xffffffc080000000 + image offset) = -272730423296 + offset.
  ref0_image = -272688875936
  ref1_offset = 136
  ref1_image = -272688875784
  ref2_offset = 144
  ref2_image = -272688870520
  ref3_offset = 0
  ref3_image = 0
}
