# GhostLock kernel profile: Redmi K50 Ultra (diting, SM8475), 5.10.81 GKI —
# the LAUNCH kernel (Global V13.0.3.0.SLFMIXM / V13.0.4.0.SLFMIXM, built 2022-04-21).
#
# ############################################################################
# # NOT YET RUN ON A DEVICE. The route this file selects (sigreturn) exists,  #
# # and everything it needs is derived and cross-checked from this image --   #
# # offsets, the cred block, all 15 task_struct fields, the dump_skip.zeroes  #
# # anchor and the route geometry (README.md in this directory). What has     #
# # never happened is a run: this build's era userspace was never booted      #
# # (a 5.10.81 kernel does not carry the Android 15 userspace, and the        #
# # Android 12 ROM that belongs to it is only now being flashed).             #
# #                                                                          #
# # The three older routes cannot deliver here -- do_futex's frame is 0x20    #
# # (vs 0x70 from 5.10.136 on), so the futex waiter sits 0x50 above the       #
# # pselect fd_set buffer, outside select_stack's [-2, +2] band; multicast    #
# # is 0x98 short and tcp_zerocopy is hardcoded 0xa0 off. That is why this    #
# # kernel needs the sigreturn route, whose 0x200-byte fpsimd copy covers     #
# # the strip at 0x140 into its window.                                      #
# ############################################################################
release = "5.10.81-android12-9-00001-g6cd504626bae-ab8485363"
schema_version = 1
kernel_major = 5
recommend_shizuku = 0
# Device-level, not build-level: the same on every diting kernel (k81/README.md).
kernel_phys_load = 2818572288
kernel_phys_offset = 2147483648
route {
  # The sigreturn route is the only delivery that reaches this build's waiter
  # depth: do_futex's frame here is 0x20, which puts the select_stack waiter
  # 0x50 above the pselect fd_set buffer -- outside the route's band. See
  # docs/analysis/sigreturn-stamp-route-plan.md and external/port/k81/README.md.
  sigreturn {
    # rt_sigreturn's 0x200-byte fpsimd copy lands at rtref.sp - 0x300 (measured
    # under QEMU on this image; identical on 5.10.101 and 5.10.136), and the
    # strip's home is 0x140 into that window -- the whole 11-word waiter fits
    # (0x140 + 0x58 < 0x200).
    waiter_off_sve = 336      # 0x150: static derivation; SVE is untestable under QEMU
    waiter_off_plain = 320    # 0x140: measured
    # dump_skip.zeroes = image +0x2c6b568 (46577000): extent 0x1000, 9 live
    # reads / 0 live writes / 0 init refs on this image (--anchor-scan
    # --anchor-symbol dump_skip.zeroes). Same acceptance profile as 5.10.236.
    lock_anchor_image = 46577000
    lock_anchor_bytes = 4096
    lock_anchor_stride = 32
  }
}
fallback {
  to = "none"
}
execution {
  selected_cpus {
    main = 4
    consumer = 5
  }
  race {
    route_wait_ms = 30
    setup_settle_us = 10000
  }
  routes {
    select_stack {
      enter_delay_us = 5000
    }
  }
}
