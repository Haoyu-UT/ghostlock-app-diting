# GhostLock kernel profile: Redmi K50 Ultra (diting, SM8475), 5.10.81 GKI —
# the LAUNCH kernel (Global V13.0.3.0.SLFMIXM / V13.0.4.0.SLFMIXM, built 2022-04-21).

# The bundled route is the AArch32 compat carrier (compat_carrier = 1): the
# select route runs in the armv7 helper. Device-proven 2026-10-31 on this
# kernel: 10/10 fresh boots, every run page_free=1 (lock anchor + W1 scratch),
# 8/8 route calls clean per run. See docs/analysis/compat-select-carrier-plan.md.
# The banner below records the sigreturn route's 2026-10-13 device history;
# that route is no longer the bundled delivery.
#
# ############################################################################
# # RUN ON A DEVICE, and its geometry measured there: 2026-10-13, Global     #
# # V13.0.3.0 -- this kernel, the launch ROM. The sigreturn route carries    #
# # the whole chain (exploit complete -> handoff -> KernelSU ready), and the #
# # copy lands at Sigma = 0x300 below the syscall entry with the strip home  #
# # at dst+0x140; in a real run pi_blocked_on - copy_dst = 0x140 exactly --  #
# # the walk reads what the trampoline delivered.                            #
# #                                                                          #
# # The three older routes cannot deliver here -- do_futex's frame is 0x20   #
# # (vs 0x70 from 5.10.136 on), so the futex waiter sits 0x50 above the      #
# # pselect fd_set buffer, outside select_stack's [-2, +2] band; multicast   #
# # is 0x98 short and tcp_zerocopy is hardcoded 0xa0 off. That is why this   #
# # kernel needs the sigreturn route, whose 0x200-byte fpsimd copy covers    #
# # the strip at 0x140 into its window.                                      #
# ############################################################################
release = "5.10.81-android12-9-00001-g6cd504626bae-ab8485363"
schema_version = 1
kernel_major = 5
# Page-free (2026-10-30): no in-anchor slot fits this anchor, so W1's value is
# the second region bm_pmd (arch/arm64/mm/mmu.c; unused on 4K kernels) at image
# +0x2bbe000, value 0xffffff802abbe100. The 0x18-byte window at +0x2bbe100 read
# zero in the QEMU boot of this Image. Device-proven 2026-10-31 with the compat
# carrier: every run page_free=1, lock anchor + W1 scratch.
selinux {
  enforcing = 0
  initialized = 2
}
w1_scratch {
  image = 45867008
}
recommend_shizuku = 0
# Device-level, not build-level: the same on every diting kernel (k81/README.md).
kernel_phys_load = 2818572288
kernel_phys_offset = 2147483648
route {
  # AArch32 compat carrier (plan option B'): the select route runs in the
  # armv7 helper. The geometry is the measured strip home below the compat
  # entry sp -- futex_time32 (240) puts it at 0x1b0 -- and the compat
  # _newselect buffer depth 0x1e0. The native refuses any pair it cannot
  # cover, so 5.10.236 (0x200/0x210) cannot select this.
  select_stack {
    compact_waiter = 1
    compat_carrier = 1
    waiter_home = 432      # 0x1b0: futex_time32 -> do_futex 0x80 -> wait 0xa0 -> +0x110
    select_dst_depth = 480 # 0x1e0: compat_core_sys_select's stack bitmap
    lock_anchor_image = 46577000
    lock_anchor_bytes = 4096
    lock_anchor_stride = 32
  }
}
fallback {
  to = "none"
}
execution {
  selected_cpus {
    main = 4
    consumer = 5
  }
  race {
    route_wait_ms = 30
    setup_settle_us = 10000
  }
  routes {
    select_stack {
      enter_delay_us = 5000
    }
  }
}
kernelsnitch {
  collisions = 8
  # proc_caches_init contains the identical kmem_cache_create_usercopy
  # ("mm_struct", 0x3c0, ...) sequence as 5.10.236's mm_cache_init.
  mm_struct_sz = 960
}
