# GhostLock kernel profile: Redmi K50 Ultra (diting, SM8475), 5.10.209 GKI
# (Global OS1.0.11.0 / OS1.0.12.0 / OS2.0.1.0 / OS2.0.2.0 -- one kernel, four releases).
#
# DEVICE-GATED 2026-10-10: run 20261010-150449 completed the full chain
# (native exited code=0, KernelSU ready, SELinux back to enforcing); 9/9
# symbol-backed offsets then verified against live /proc/kallsyms on this kernel.
# Three earlier runs failed for reasons outside the kernel -- two on the app's
# cpuset, one wedge that remains unexplained. See external/port/k209/README.md.
# Unlike 5.10.226, which shared most of 5.10.236's layout, ALL TEN offset.* values
# differ here -- nothing about this build could be inherited by resemblance.

release = "5.10.209-android12-9-00019-g4ea09a298bb4-ab12292661"
schema_version = 1
kernel_major = 5
recommend_shizuku = 0
kernel_phys_load = 2818572288
kernel_phys_offset = 2147483648
route {
  select_stack {
    # Re-derived on this binary: core_sys_select (sub sp #0x1c0) and
    # futex_wait_requeue_pi (sub sp #0x1a0) have the same frames as 5.10.236, and
    # the same instruction count (961 lines disassembled).
    waiter_shift = -2
    compact_waiter = 1
    # dump_skip.zeroes at +0x2a39598 on this build (44275096); same neighbour
    # core_uses_pid at +0x1000, and the same two references, both reads from
    # dump_skip, none from init text.
    lock_anchor_image = 44275096
    lock_anchor_bytes = 4096
    lock_anchor_stride = 32
  }
}
fallback {
  to = "none"
}
execution {
  selected_cpus {
    main = 4
    consumer = 5
  }
  race {
    route_wait_ms = 30
    setup_settle_us = 10000
  }
  routes {
    select_stack {
      enter_delay_us = 5000
    }
  }
}
kernelsnitch {
  collisions = 8
  # Carried over: mm_types.h unchanged and the build config matches; to be
  # re-measured on the device boot.
  mm_struct_sz = 960
}
# Field offsets carry over on the same argument as 5.10.226: one config for 209
# and 236 apart from two newer mitigation options, one compiler (clang r416183b
# in both banners), and no moved struct definition (sched.h differs only by a
# dropped #include; cred.h, mm_types.h, rtmutex.h, key.h unchanged).
