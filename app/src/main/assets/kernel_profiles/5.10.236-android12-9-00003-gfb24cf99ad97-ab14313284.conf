  copy_size = 168
  usage_offset = 0
  usage_value = 256
  caps_offset = 40
  caps_count = 5
  caps_value = 2199023255551
  ref_count = 3
  ref0_offset = 128
  # ref*_image = KIMAGE_TEXT_BASE + image offset, signed decimal.
  ref0_image = -272688810528
  ref1_offset = 136
  ref1_image = -272688810376
  ref2_offset = 144
  ref2_image = -272688805112
  ref3_offset = 0
  ref3_image = 0
