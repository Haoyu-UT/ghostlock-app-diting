# GhostLock kernel profile: Redmi K50 Ultra (diting, SM8475), 5.10.236 GKI.
#
# *** TEST BUILD -- sigreturn route, 2026-10-12 ***
# A copy of the shipped profile with the route block swapped to the new
# sigreturn-stamp route, for the P2 mechanism run on this device. Every other
# value is byte-identical to the shipped profile. The offsets are the 5.10.236
# geometry measured by the P1.5b falsifier: the plain restore path's copy lands
# at depth 0x300 with the waiter at 0x210, so waiter byte 0 sits at 0x300-0x210
# = 0xf0 inside the 0x200-byte vregs window (SVE path: 0x100). The anchor trio
# is the shipped one.

release = "5.10.236-android12-9-00003-gfb24cf99ad97-ab14313284"
schema_version = 1
kernel_major = 5
recommend_shizuku = 0
kernel_phys_load = 2818572288
kernel_phys_offset = 2147483648
route {
  sigreturn {
    waiter_off_sve = 256
    waiter_off_plain = 240
    lock_anchor_image = 44279184
    lock_anchor_bytes = 4096
    lock_anchor_stride = 32
  }
}
fallback {
  to = "none"
}
# The waiter's park timeout also sets the dangling-waiter window (requeue at
# ~50ms → route at park+timeout). kprobe trace 2026-10-08: ambient scheduler
# ops walk the detached waiter and deadlock the box inside that window.
# 1000ms → 100ms shrank the exposure ~19x. Same dance, same route.
#
# BATCH E (2026-10-08 late) — crush the window. Phase analysis of the 12-run
# W1 death streak: deaths land at park+0..1.4ms (pre-requeue), park+84ms and
# park+100ms (post-detach, pre-route) — i.e. inside the exposure window whose
# width is exactly (route_wait_ms - setup_settle_us); the route cannot start
# earlier than the park timeout because the waiter thread runs it after
# FUTEX_WAIT_REQUEUE_PI returns (threads.cpp:39/60, kprobe: park 922.3916 →
# EDEADLK detach 922.4428 → route entry 922.4919 = park+100.4ms).
# 100/50 → 30/10: exposure 50ms → 20ms. Requeue margin stays 18.7ms (the
# requeue lands at settle+1.3ms in every trace) vs upstream's own fast-repair
# path margin of 15ms (threads.cpp:162 uses a 5ms settle, 20ms park).
# Revert: route_wait_ms = 100, setup_settle_us = 50000.
execution {
  # Batch D (little cores) is BLOCKED on this ROM: with 0/1 the main thread
  # pinned fine but every forked spray child got EINVAL pinning to CPU 0 and
  # the run died at startup; the UI never accepted 2/3 (displays 0/1 only) and
  # a reboot did not clear it. Reverted to the proven big-core pair; batch D's
  # failure is CPU-pair-specific (the fix build ran 4/5 clean — run 171908).
  selected_cpus {
    main = 4
    consumer = 5
  }
  race {
    # Batch E: park timeout 100 → 30ms. Must stay meaningfully above
    # setup_settle_us or the requeue misses the park (CMP_REQUEUE_PI ret=0,
    # no dance — batch B at settle 150 > wait 100 was invalid exactly so).
    route_wait_ms = 30
    # Settle sweep concluded: 25/50/75 all froze (run variance > knob effect).
    # Back to the upstream-default 50ms — the best-observed setting.
    # Batch E: 50 → 10ms. The park is enqueued within ~1ms of waiter_waiting
    # (requeue lands at settle+1.3ms in every trace), so 50ms was ~10x more
    # margin than the park needs. Revert: 50000.
    setup_settle_us = 10000
  }
  routes {
    select_stack {
      # Batch C: fire the attempt-1 consumer walk 10ms after the route starts
      # (was 50). The walk is what lands the write; until it fires, ambient
      # touchers have a free run at the detach residue (B' run 1 died 10.5ms
      # after route entry). Attempts 2+ use the native 50/30/70/10/... ladder.
      # Batch E: 10 → 5ms (attempt 1 only; compact_waiter routes attempts 2+
      # through the native ladder regardless). Revert: 10000.
      #
      # Batch F (2026-10-09) TRIED 5 → 2ms TO FIX W3-0 AND IT DOES NOT WORK.
      # Do not retry this. Run 8's oops was rb_insert_color+0x48, NULL+8: a later
      # insert walked a tree the WRITE had already polluted -- the erase stores
      # `target` into the anchor's rb_root as collateral, W3-0 writes 0 there, so
      # the fake parent reads RED and the insert dereferences a NULL grandparent.
      # This consumer walk (select_stack_route.cpp:632's consumer_go bump ->
      # __sched_setscheduler -> rt_mutex_adjust_pi) is the insert that can land
      # after that erase, so Batch F fired it earlier to get ahead of the erase.
      #
      # It worked mechanically and was still fatal, in the OPPOSITE direction: at
      # 2ms the walk runs BEFORE the erase, follows the target while it still
      # holds comm, and dies at rt_mutex_adjust_prio_chain+0x548 dereferencing
      # 0x0034333231305fa6 -- "_01234", ASCII out of comm. BEFORE and AFTER the
      # erase are both fatal, so ordering is not the lever and no timing value
      # fixes W3-0. Reverted to 5000; a real fix must be structural. See
      # docs/analysis/w3-post-descent-wedge-plan.md.
      enter_delay_us = 5000
    }
  }
}
