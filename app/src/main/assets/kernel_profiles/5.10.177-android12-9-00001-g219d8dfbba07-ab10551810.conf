# GhostLock kernel profile: Redmi K50 Ultra (diting, SM8475), 5.10.177 GKI --
# Global V14.0.5.0.TLFMIXM (Android 13, built 2023-07-18).
#
# ############################################################################
# # CANDIDATE -- NOT DEVICE-VERIFIED (2026-10-14).                           #
# #                                                                          #
# # Every value below comes from this kernel image's own instructions and    #
# # data, cross-checked against the device-verified 5.10.236 control image,  #
# # and the ten offset.* values are verified against this kernel *running*   #
# # under QEMU (k177/runtime-crosscheck.txt). What is missing is a           #
# # real-device run. Do not mark this build supported and do not bundle it   #
# # into the app until a device gate passes (the 236 / 226 / 209 profiles    #
# # each had one before they were bundled).                                  #
# #                                                                          #
# # Derivation, per-value basis and raw evidence:                            #
# # external/port/k177/README.md and the files beside it.                    #
# #                                                                          #
# # Route: select_stack is in band here -- do_futex's frame is 0x70 on this  #
# # image (it becomes 0x70 at 5.10.136 and is 0x20 below that), so the       #
# # wait-requeue-pi waiter sits at the pselect fd_set buffer's depth. The    #
# # sigreturn route is NOT used here.                                        #
# #                                                                          #
# # EVERY offset.* value differs from 5.10.236's -- these are 10 of the 12   #
# # image-address-bearing values (the other two are the three cred refs and  #
# # lock_anchor_image, which also all differ). Nothing carries over by       #
# # accident: the two images are different builds of the same tree.          #
# ############################################################################
# Bundled 2026-10-14 by operator decision: this profile is a CONFIG EXPORTED
# FROM THE KERNEL and verified against the kernel running under QEMU -- it has
# never actually run on a device. Treat it as untested; report failures.
release = "5.10.177-android12-9-00001-g219d8dfbba07-ab10551810"
schema_version = 1
kernel_major = 5
recommend_shizuku = 0
# Device-level, not build-level: the extractor emits the same pair for this
# image as for 5.10.236 (kernel_phys_load = "Kernel code" start, = 0xa8000000;
# kernel_phys_offset = DRAM base, = 0x80000000). k226/README.md.
kernel_phys_load = 2818572288
kernel_phys_offset = 2147483648
route {
  select_stack {
    # Unchanged. The route's two frame sizes are instruction-identical to the
    # 5.10.236 control: core_sys_select does `sub sp, sp, #0x1c0` and
    # futex_wait_requeue_pi does `sub sp, sp, #0x1a0` (frames-5.10.177-vs-236.txt).
    # The two syscall wrappers the chains hang from are identical too
    # (__arm64_sys_pselect6 #0xa0, __arm64_sys_futex #0x90), and do_futex is
    # #0x70 -- so the fd_set buffer and the rt_mutex waiter stay at the same
    # stack depth and waiter_shift = -2 carries.
    #
    # NOTE do_select's own frame is NOT the same: 0x320 here vs 0x360 on
    # 5.10.236, because vanilla's MAX_STACK_ALLOC for __clang__ went 768 -> 832
    # between the two tags, taking N_INLINE_POLL_ENTRIES from 8 to 9 (the
    # memset lengths in do_select read 0x230 and 0x270 -- one extra 0x40
    # poll_table_entry). It cannot move the geometry: do_select is called from
    # core_sys_select and its frame lies *below* the fd_set buffer, which is
    # addressed off core_sys_select's own sp.
    waiter_shift = -2
    compact_waiter = 1
    # dump_skip.zeroes = image offset 0x2a27598 (44201368), the zeroed .bss
    # array in fs/coredump.c. Same acceptance profile as the shipped 236 anchor:
    # extent 0x1000 (`core_uses_pid` is the next symbol, at +0x1000), and the
    # only two references in the whole image are inside dump_skip at +0x8c and
    # +0x254 -- both materialise the address as a *source* pointer (at +0x254
    # into `__kernel_write`, at +0xcc `mov x1, x23`), no init-range reference
    # (anchor-xref-5.10.177.txt, `init-range hits: 0 / 2`).
    lock_anchor_image = 44201368
    lock_anchor_bytes = 4096
    lock_anchor_stride = 32
  }
}
fallback {
  to = "none"
}
execution {
  # Behaviour, not layout: carried unchanged from the device-verified profiles.
  selected_cpus {
    main = 4
    consumer = 5
  }
  race {
    route_wait_ms = 30
    setup_settle_us = 10000
  }
  routes {
    select_stack {
      enter_delay_us = 5000
    }
  }
}
kernelsnitch {
  collisions = 8
  # Read out of this image: the kmem_cache_create_usercopy("mm_struct", ...)
  # call, which 5.10.177 has inlined into proc_caches_init (there is no
  # mm_cache_init symbol on this build -- on 5.10.236 it is its own function).
  # `mov w1, #0x3c0` (960), flags `mov w3,#0x2000`/`movk w3,#0x404,lsl#16`
  # (= 0x4042000), useroffset `mov w4, #0x168`, usersize `mov w5, #0x170` and
  # `mov w2, wzr` align -- identical to mm_cache_init on the 5.10.236 control
  # image, whose device /proc/slabinfo measured objsize 960.
  mm_struct_sz = 960
}
task_struct {
  # Every field below was read out of THIS image's own instructions in the same
  # function the 5.10.236 control uses, and matches the shipped 236 value --
  # see field-offsets-5.10.177-vs-236.txt for the instruction and its address
  # in both images. sched_task_group, which k101/README.md had to carry
  # unverified, IS read out here (sched_move_task, `str x8, [x19, #0x310]`).
  prio = 132
  normal_prio = 140
  sched_task_group = 784
  pi_lock = 2156
  pi_waiters = 2176
  pi_top_task = 2192
  pi_blocked_on = 2200
  pid = 1480
  tgid = 1484
  atomic_flags = 1424
  real_cred = 1912
  cred = 1920
  comm = 1936
  tasks = 1224
  seccomp = 2120
}
cred {
  # struct cred is 168 bytes in this image too: cred_init calls
  # kmem_cache_create("cred_jar", sizeof(struct cred), ...) with `mov w1, #0xa8`
  # -- the same immediate and the same 0x4042000 flags as the control. And
  # cap_capable is instruction-identical between the two images (0 of 33
  # instructions differ after address normalisation): it reads cred->user_ns at
  # +0x88 and cap_effective at +0x38, which only holds with the 4-byte
  # atomic_t usage. The vanilla v5.10.236 tag's `atomic_long_t usage` never
  # reached these images -- see README.md "the trap".
  copy_size = 168
  usage_offset = 0
  usage_value = 256
  caps_offset = 40
  caps_count = 5
  caps_value = 2199023255551
  ref_count = 3
  ref0_offset = 128
  # ref*_image name root_user, init_user_ns, init_groups in this image at
  # 0x279f678 / 0x279f710 / 0x27a0ba0 (symbols-5.10.177.txt). Value =
  # 0xffffffc080000000 + image offset, written as a signed 64-bit decimal --
  # the encoding the shipped 5.10.236 values decode to, re-confirmed by
  # running sym_grep on the control image, where the three symbols land exactly
  # on the shipped ref0/1/2_image.
  ref0_image = -272688875912
  ref1_offset = 136
  ref1_image = -272688875760
  ref2_offset = 144
  ref2_image = -272688870496
  ref3_offset = 0
  ref3_image = 0
}
offset {
  # This image's own kallsyms, via ghostlock-extract --iomem external/iomap.txt
  # --phys 0xa8000000. Validated as a control on external/rom/Image-5.10.236-control,
  # where it reproduces all ten device-verified values exactly.
  # All ten differ from 5.10.236's; the deltas are listed in README.md.
  init_task = 41467584
  init_cred = 41552632
  empty_zero_page = 43495424
  root_task_group = 43515968
  selinux_enforcing = 44235672
  selinux_blob_sizes = 36592632
  security_hook_heads = 36590952
  slide_nfulnl_logger = 41423776
  slide_loggers_0_1 = 41423576
  slide_boot_id = 44362661
}
