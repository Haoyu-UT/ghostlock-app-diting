  normal_prio = 140
  sched_task_group = 784
  pi_lock = 2156
  pi_waiters = 2176
  pi_top_task = 2192
  pi_blocked_on = 2200
  pid = 1480
  tgid = 1484
  atomic_flags = 1424
  real_cred = 1912
  cred = 1920
  comm = 1936
  tasks = 1224
  seccomp = 2120
}
