# GhostLock kernel profile: Redmi K50 Ultra (diting, SM8475), 5.10.226 GKI
# (Global OS2.0.205.0.VLFMIXM).
#
# DEVICE-GATED 2026-10-10: one run, full chain, no oops, no freeze
# (external/port/k226/run-1/). Derived by porting the device-verified 5.10.236
# profile to this build; basis per value and raw evidence in
# external/port/k226/README.md and the files beside it. n=1 so far -- the
# 5.10.236 profile was validated over a series, this one has had one run.
# Not bundled into the app.

release = "5.10.226-android12-9-00064-gea4a6f067d3f-ab12969919"
schema_version = 1
kernel_major = 5
recommend_shizuku = 0
kernel_phys_load = 2818572288
kernel_phys_offset = 2147483648
route {
  select_stack {
    # Unchanged: core_sys_select (sub sp #0x1c0) and futex_wait_requeue_pi
    # (sub sp #0x1a0) are instruction-identical between the two builds apart from
    # address materialisation, so the frame sums (pselect 0xa0+0x1c0, futex
    # 0x90+0x70+0x1a0) and the derived shift carry over. See
    # disasm-diff-5.10.226-vs-5.10.236.txt.
    waiter_shift = -2
    compact_waiter = 1
    # dump_skip.zeroes is at image +0x2a3a590 in BOTH builds (symbols-*.txt), with the
    # same neighbour (core_uses_pid at +0x1000) and the same two references, both reads
    # from dump_skip and none from init text (anchor-xref-*.txt).
    lock_anchor_image = 44279184
    lock_anchor_bytes = 4096
    lock_anchor_stride = 32
  }
}
fallback {
  to = "none"
}
execution {
  selected_cpus {
    main = 4
    consumer = 5
  }
  race {
    route_wait_ms = 30
    setup_settle_us = 10000
  }
  routes {
    select_stack {
      enter_delay_us = 5000
    }
  }
}
kernelsnitch {
  collisions = 8
  # Re-measured on the 5.10.226 boot itself: /proc/slabinfo mm_struct objsize 960.
  mm_struct_sz = 960
}
# Field offsets below carry over from 5.10.236 on the argument that the two builds
# share one config (config-diff: three lines, none structural), one compiler (clang
# r416183b in both banners) and no moved struct definition (headers checked: sched.h,
# cred.h, mm_types.h, rtmutex.h, key.h unchanged; seccomp.h moved a no-op inline only).
# They are argued, not measured, on 5.10.226.
