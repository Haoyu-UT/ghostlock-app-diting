# GhostLock 6.x credential template (HOCON): identical across 6.x kernels.
# Every field of native `kCred` is present; the 6.x reference slots are unused
# and carried as explicit `null`.
cred {
  copy_size = 128
  usage_size = 4
  usage_offset = null
  usage_value = 1
  uid_offset = 4
  security_offset = 120
  caps_offset = 40
  caps_count = 5
  caps_value = -1
  ref_count = null
  ref0_offset = null
  ref1_offset = null
  ref2_offset = null
  ref3_offset = null
  ref0_image = null
  ref1_image = null
  ref2_image = null
  ref3_image = null
}
