# GhostLock per-device execution defaults (HOCON).
#
# These values were measured on the named device and are applied only when the
# profile leaves a timing parameter null. A device without an entry uses the
# generic execution-tuning.conf values. The 5.10.236 asset's execution comments
# carry the batch C/D/E/F evidence behind the diting values.
device_defaults {
  diting {
    execution {
      race {
        route_wait_ms = 30
        setup_settle_us = 10000
      }
      routes {
        select_stack {
          enter_delay_us = 5000
        }
      }
    }
  }
}
