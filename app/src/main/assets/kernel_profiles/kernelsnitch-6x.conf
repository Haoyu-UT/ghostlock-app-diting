# GhostLock 6.x KernelSnitch tuning (HOCON): identical across 6.x kernels.
# `mm_struct_sz = 1280` is the 6.6/6.12 family stride (QEMU-confirmed on
# 6.6.30 / 6.6.77 and 6.12.23-g16e473); the android14-6.1 profiles override it
# with 1024 (QEMU-confirmed on 6.1.138).
kernelsnitch {
  collisions = 4
  mm_struct_sz = 1280
}
