# GhostLock kernel profile: Redmi K50 Ultra (diting, SM8475), 5.10.101 GKI —
# Global V14.0.1.0.TLFMIXM / V14.0.2.0.TLFMIXM (Android 13, built 2022-10-21).
#
# ############################################################################
# # CANDIDATE — NOT DEVICE-VERIFIED (2026-10-14).                            #
# #                                                                          #
# # Every value below comes from the kernel image itself, and the ten        #
# # offset.* values are verified against this kernel *running* under QEMU    #
# # (the method validated by reproducing 5.10.236's ten device-verified      #
# # values exactly -- k101/runtime-crosscheck.txt). What is missing is a     #
# # real-device run; do not mark this build supported until a device gate    #
# # passes (the 236 / 226 / 209 profiles each had one before they were       #
# # bundled).                                                                #
# #                                                                          #
# # Derivation: external/port/k101/README.md. It needs the sigreturn route:  #
# # do_futex's frame is 0x20 (it becomes 0x70 at 5.10.136), which puts the   #
# # select_stack waiter 0x50 above the pselect fd_set buffer, outside that   #
# # route's band -- the same reason 5.10.81 needs it, and the geometry is    #
# # the 81 one, measured identical under QEMU for 101.                      #
# ############################################################################
# Bundled 2026-10-14 by operator decision: this profile is a CONFIG EXPORTED
# FROM THE KERNEL and verified against the kernel running under QEMU -- it has
# never actually run on a device. Treat it as untested; report failures.
release = "5.10.101-android12-9-00005-ga829d48e78bd-ab9206161"
schema_version = 1
kernel_major = 5
recommend_shizuku = 0
# Device-level, not build-level: emitted for this image by the extractor and
# identical on every diting kernel (k226/README.md).
kernel_phys_load = 2818572288
kernel_phys_offset = 2147483648
route {
  sigreturn {
    # rt_sigreturn's 0x200-byte fpsimd copy lands at rtref.sp - 0x300 on this
    # image (QEMU, k81/qemu/results.txt: identical on 5.10.81/101/136), and the
    # strip's home is 0x140 into that window.
    waiter_off_sve = 336      # 0x150: static derivation; SVE is untestable under QEMU
    waiter_off_plain = 320    # 0x140: measured
    # dump_skip.zeroes = image +0x2a0d568 (44094824): extent 0x1000, neighbour
    # core_uses_pid at +0x1000, two references both reads from dump_skip --
    # the same acceptance profile as 5.10.236 and 5.10.81.
    lock_anchor_image = 44094824
    lock_anchor_bytes = 4096
    lock_anchor_stride = 32
  }
}
fallback {
  to = "none"
}
execution {
  selected_cpus {
    main = 4
    consumer = 5
  }
  race {
    route_wait_ms = 30
    setup_settle_us = 10000
  }
  routes {
    select_stack {
      enter_delay_us = 5000
    }
  }
}
kernelsnitch {
  collisions = 8
  # proc_caches_init contains the same kmem_cache_create_usercopy("mm_struct",
  # 0x3c0, ...) sequence as 5.10.236's mm_cache_init -- read from this image.
  mm_struct_sz = 960
}
task_struct {
  # All fifteen read out of this image's own instructions and compared against
  # the 5.10.236 control (k101/README.md has the function and instruction for
  # each). The vanilla-stable header diff is NOT the authority here: it claims
  # two fields were added between 101 and 236, and this image's code
  # contradicts that (the GKI tree did not follow).
  prio = 132
  normal_prio = 140
  sched_task_group = 784
  pi_lock = 2156
  pi_waiters = 2176
  pi_top_task = 2192
  pi_blocked_on = 2200
  pid = 1480
  tgid = 1484
  atomic_flags = 1424
  real_cred = 1912
  cred = 1920
  comm = 1936
  tasks = 1224
  seccomp = 2120
}
cred {
  # Struct cred is byte-identical to 236's: cap_capable reads cred->user_ns at
  # +0x88 and cap_effective at +0x38 in both images, which pins usage as the
  # 4-byte atomic_t (the vanilla v5.10.236 tag's atomic_long_t never reached
  # this tree).
  copy_size = 168
  usage_offset = 0
  usage_value = 256
  caps_offset = 40
  caps_count = 5
  caps_value = 2199023255551
  ref_count = 3
  ref0_offset = 128
  ref0_image = -272689007632
  ref1_offset = 136
  ref1_image = -272689007480
  ref2_offset = 144
  ref2_image = -272689002216
  ref3_offset = 0
  ref3_image = 0
}
offset {
  # This image's own kallsyms, via ghostlock-extract (validated as a control on
  # the 5.10.236 image, where it reproduces all ten device-verified values).
  init_task = 41336576
  init_cred = 41420912
  empty_zero_page = 43388928
  root_task_group = 43409472
  selinux_enforcing = 44129112
  selinux_blob_sizes = 36520016
  security_hook_heads = 36518336
  slide_nfulnl_logger = 41292712
  slide_loggers_0_1 = 41292512
  slide_boot_id = 44234108
}
