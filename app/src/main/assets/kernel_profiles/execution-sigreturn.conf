# GhostLock execution tuning for the sigreturn route (HOCON); include it only
# from profiles whose route (or fallback) is sigreturn.
#
# The consumer's walk cadence. One walk per route attempt is what the measured
# select_stack runs on this port use, and the sigreturn route re-stamps its
# strip continuously while that walk runs, so the walk's own delay is the
# native constant, not a profile key.
execution {
  routes {
    sigreturn {
      consumer_max_calls = 1
      consumer_burst_calls = 1
    }
  }
}
