# GhostLock execution tuning measured on the Redmi K50 Ultra (diting, SM8475).
# This is a device preset, not a kernel property: the app merges it under
# execution-tuning.conf when it runs on a diting, so a generated 5.10 profile
# keeps the measured values instead of the shared 1000/50000 defaults.
#
# race: 30/10 closes the dangling-waiter exposure window (the park timeout and
# the settle before the route starts); enter_delay_us = 5000 is the measured
# attempt-1 consumer walk for this port. The bundled diting profiles carry the
# same values, and an imported profile may override any of them.
execution {
  race {
    route_wait_ms = 30
    setup_settle_us = 10000
  }
  routes {
    select_stack {
      enter_delay_us = 5000
    }
  }
}
